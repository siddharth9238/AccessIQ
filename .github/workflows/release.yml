name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

env:
  APP_NAME: accessiq

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-m2-

    - name: Set up Git
      run: |
        git config user.name "${{ github.actor }}"
        git config user.email "${{ github.actor }}@users.noreply.github.com"

    - name: Extract version from tag
      id: get_version
      run: |
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Verify JAR exists
      run: |
        if [ ! -f "target/accessiq-1.0.0.jar" ]; then
          echo "JAR file not found!"
          exit 1
        fi

    - name: Generate release notes
      id: release_notes
      uses: release-drafter/release-drafter@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        upstream-owner: ${{ github.repository_owner }}
        upstream-repository: ${{ github.event.repository.name }}

    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: |
          ## Release ${{ github.ref_name }}
          
          ### Changes
          - See commit history for details
          
          ### Downloads
          - [application.jar](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/accessiq-1.0.0.jar)
          
          ### Installation
          ```bash
          # Download the JAR
          wget https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/accessiq-1.0.0.jar
          
          # Run the application
          java -jar accessiq-1.0.0.jar
          ```
        files: |
          target/accessiq-1.0.0.jar
        draft: false
        prerelease: ${{ contains(github.ref_name, 'rc') }}
        generate_release_notes: true

    - name: Upload release artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-jar
        path: target/accessiq-1.0.0.jar
        retention-days: 30

    - name: Success notification
      run: |
        echo "Release ${{ github.ref_name }} created successfully!"