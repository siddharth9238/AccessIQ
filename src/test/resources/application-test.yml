spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
      use-new-id-generator-mappings: false
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.H2Dialect
          format_sql: true
          hbm2ddl:
            auto: create-drop

logging:
  level:
    com.accessiq: DEBUG
    org.hibernate.SQL: DEBUG

accessiq:
  jwt:
    secret: "test-secret-key-for-testing-purposes-only-32chars"
    access-token-minutes: 15
    refresh-token-days: 7
  bootstrap:
    admin:
      email: admin@test.accessiq.com
      password: Admin@Test123456
    sample:
      password: Sample@Test123456