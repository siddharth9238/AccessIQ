spring:
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=AccessIQ;encrypt=true;trustServerCertificate=true
    username: sa
    password: YourStrongPassword123!
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: false

    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true

  sql:
    init:
      mode: never